name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit tests flight-service
        run: cd flight-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests ticket-service
        run: cd ticket-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests bonus-service
        run: cd bonus-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests gateway-service
        run: cd gateway-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build images
        timeout-minutes: 10
        run: docker compose build --push

      # TODO deploy to k8s with liveness and readyness probes

      - name: Wait before services are ready
        run: kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout 3m
      
      # TODO setup parameters in classroom/autograding.json
      
